[package]
name = "gdl-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gauntlet Dark Legacy engine reimplementation"

[[bin]]
name = "gauntlet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gdl-formats = { path = "../gdl-formats" }
wgpu = "25"
winit = "0.30"
gilrs = "0.11"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.17"
log = "0.4"
env_logger = "0.11"
gcdisc = { path = "../gcdisc" }
