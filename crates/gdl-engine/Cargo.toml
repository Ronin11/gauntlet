[package]
name = "gdl-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gauntlet Dark Legacy engine reimplementation"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gauntlet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gdl-formats = { path = "../gdl-formats" }
wgpu = "25"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.17"
log = "0.4"
env_logger = "0.11"
gcdisc = { path = "../gcdisc" }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

# cpal (under rodio) plays through AAudio on Android.
rodio = { version = "0.21", default-features = false, features = ["playback"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
