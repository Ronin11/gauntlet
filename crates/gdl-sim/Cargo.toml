[package]
name = "gdl-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gauntlet Dark Legacy simulation: the game rules, levels, heroes and monsters, with no window, GPU or audio"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
gdl-formats = { path = "../gdl-formats" }
gcdisc = { path = "../gcdisc" }
glam = { version = "0.30", features = ["bytemuck", "libm", "scalar-math"] }
libm = "0.2"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
